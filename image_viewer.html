<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图片查看</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="attachment://image.png" alt="图片">
</body>
</html>
