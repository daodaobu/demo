<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>首图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }
        .image-container {
            position: relative;
            max-width: 100%;
            max-height: 100vh;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
        /* 推荐组件热区 - 精确匹配圆角条 */
        .recommend-hotspot {
            position: absolute;
            left: 5%;
            bottom: 26%;
            width: 78%;
            height: 4.5%;
            cursor: pointer;
            z-index: 10;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="首图.png" alt="首图">
        <div class="recommend-hotspot" onclick="location.href='health-landing-v2.html'"></div>
    </div>
</body>
</html>
