<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>推荐医生 · 百度健康·医选</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #060d1a;
    color: #e8d49a;
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
  }

  :root {
    --gold-dark: #8b6914;
    --gold-mid: #c9a84c;
    --gold-light: #f5d87e;
    --bg-card: #0c1830;
    --text-primary: #f5ecd0;
    --text-sub: #8a9bb5;
    --divider: rgba(201,168,76,0.15);
  }

  .gold-text {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }

  /* 导航栏 */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #060d1a;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--divider);
  }
  .navbar-back {
    font-size: 28px;
    color: var(--gold-light);
    line-height: 1;
    cursor: pointer;
  }
  .navbar-title {
    font-size: 17px;
    font-weight: 600;
  }
  .navbar-right { width: 28px; }

  /* 页面标题 */
  .page-header {
    padding: 18px 16px 12px;
  }
  .page-header-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .page-header-sub {
    font-size: 12px;
    color: var(--text-sub);
  }
  .page-header-count {
    font-size: 12px;
    color: var(--gold-mid);
    margin-top: 4px;
  }

  /* 科室筛选 */
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 8px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 12px;
    background: var(--bg-card);
    color: var(--text-sub);
    border: 1px solid var(--divider);
    border-radius: 14px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-mid));
    color: #060d1a;
    border-color: var(--gold-mid);
    font-weight: 600;
  }

  /* 医生列表 */
  .doctor-list { padding: 0 16px 24px; }
  .doctor-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--divider);
  }
  .doctor-item:last-child { border-bottom: none; }
  .doctor-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-mid));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .doctor-info { flex: 1; min-width: 0; }
  .doctor-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .doctor-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .doctor-title-tag {
    font-size: 10px;
    color: var(--gold-mid);
    border: 1px solid var(--gold-dark);
    border-radius: 3px;
    padding: 0 4px;
  }
  .doctor-meta {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .doctor-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .doctor-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .doctor-badge.sanjia { background:rgba(201,168,76,0.15); color:var(--gold-mid); border:1px solid var(--gold-dark); }
  .doctor-badge.fudan { background:rgba(74,144,226,0.15); color:#7ab8f5; border:1px solid rgba(74,144,226,0.4); }
  .doctor-badge.verified { background:rgba(46,160,67,0.15); color:#58c97d; border:1px solid rgba(46,160,67,0.4); }

  .empty {
    text-align: center;
    padding: 40px 0;
    color: var(--text-sub);
    font-size: 13px;
  }
</style>
</head>
<body>

<nav class="navbar">

</body>
</html>
